
x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - ./docker/superset_config.py:/app/pythonpath/superset_config.py

services:
  db:
    container_name: postgres_container
    image: postgres:15.19
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: myst
      POSTGRES_PASSWORD: myst
    volumes:
      - ./postgres/data:/var/lib/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
      - ./postgres/superset_init.sql:/docker-entrypoint-initdb.d/superset_init.sql
    networks:
      - my-network    

  af:
    container_name: airflow_container
    image: apache/airflow:3.3.2
    ports:
      - 8080:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./request:/opt/airflow/request
      - ./.env:/opt/airflow/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      bash -c "airflow db migrate && airflow standalone"
    depends_on:
      - db
    networks:
      - my-network
  
  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    environment:
      DBT_PROFILES_DIR: "/root/.dbt"
    volumes:
      - ./dbt/my_folder:/usr/app/
      - ./dbt:/root/.dbt
    working_dir: /usr/app
    depends_on:
      - db
    networks:
      - my-network
    command: run

  superset:
    env_file:
      - path: docker/.env # default
        required: true
    image: apache/superset:3.0.0-py310
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports:
      - ${SUPERSET_PORT:-8088}:8088
    user: *superset-user
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    environment:
      DATABASE_DB: "superset_db"     
    networks:
      - my-network

  superset-init:
    image: apache/superset:3.0.0-py310
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: *superset-user
    volumes: *superset-volumes
    environment:
      SUPERSET_FORCE_LOAD_EXAMPLES: "no"
      DATABASE_DB: "superset_db"
    healthcheck:
      disable: true
    networks:
      - my-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - my-network












networks:
  my-network:
    driver: bridge


volumes:
  redis:
    external: false